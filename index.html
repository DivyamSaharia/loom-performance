<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hanuman Weavelon 2 · Loom Performance</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="W2 Looms">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f3f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Look and feel follows the Hanuman Fabric Database app: deep green sidebar with a lime active item, grey search bar,
   segmented controls, chips, white rounded cards and uppercase table headings. Phones get a bottom tab bar. */
:root{box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}
body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}
:root{
  --bg:#f3f5f0; --panel:#ffffff; --fill:#e3e3e8; --soft:#ededf2; --ink:#1c1c1e; --muted:#6c6c70; --muted-2:#8e8e93; --line:#d1d1d6;
  --brand:#002a00; --lime:#a6ce38; --accent:#2b6a1f; --accent-ink:#1e4a12; --accent-soft:#eef5dc; --side:#002a00;
  --good:#1d6b35; --good-soft:#e2f1e4; --warn:#7a4300; --warn-soft:#fdf0d9; --bad:#b3261e; --bad-soft:#fbe5e3; --info:#0a5a50; --info-soft:#dcf2ee;
  --bar:#a6ce38; --barline:#1c1c1e; --shadow:0 1px 2px rgba(0,0,0,.12); --glass:rgba(249,249,249,.92);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000; --panel:#1c1c1e; --fill:#2c2c2e; --soft:#2c2c2e; --ink:#fff; --muted:#a1a1a6; --muted-2:#8e8e93; --line:#38383a;
  --accent:#a6ce38; --accent-ink:#c5e27a; --accent-soft:#1f2a0e; --side:#001a00;
  --good:#4cd17a; --good-soft:#123320; --warn:#ffc56b; --warn-soft:#3a2a10; --bad:#ff6b60; --bad-soft:#3a1714; --info:#6fe0cf; --info-soft:#0f3330;
  --bar:#6f8f25; --barline:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.5); --glass:rgba(22,22,24,.92); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000; --panel:#1c1c1e; --fill:#2c2c2e; --soft:#2c2c2e; --ink:#fff; --muted:#a1a1a6; --muted-2:#8e8e93; --line:#38383a;
  --accent:#a6ce38; --accent-ink:#c5e27a; --accent-soft:#1f2a0e; --side:#001a00;
  --good:#4cd17a; --good-soft:#123320; --warn:#ffc56b; --warn-soft:#3a2a10; --bad:#ff6b60; --bad-soft:#3a1714; --info:#6fe0cf; --info-soft:#0f3330;
  --bar:#6f8f25; --barline:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.5); --glass:rgba(22,22,24,.92); color-scheme:dark}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- shell: sidebar (laptop) / bottom tab bar (phone) */
.shell{min-height:100vh}
.sidebar{display:none}
.sb-brand{display:flex;align-items:center;gap:12px;padding:2px 6px 18px}
.sb-logo{width:46px;height:46px;border-radius:10px;flex:none;display:block;background:#fff;padding:2px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.sb-top{letter-spacing:2px;text-transform:uppercase;color:var(--lime);font-size:12px;font-weight:700}
.sb-main{color:#fff;white-space:nowrap;margin-top:2px;font-size:16px;font-weight:700}
.sb-nav{display:flex;flex-direction:column;gap:2px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border-radius:8px;color:rgba(255,255,255,.86);text-decoration:none;font-size:15px;border:0;background:none;cursor:pointer;text-align:left}
.sb-item svg{color:var(--lime);flex:none}
.sb-item:hover{background:rgba(255,255,255,.08)}
.sb-item[aria-current="page"]{background:var(--lime);color:#002a00;font-weight:600}
.sb-item[aria-current="page"] svg{color:#002a00}
.sb-item .sb-count{margin-left:auto;font-size:13px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.sb-item[aria-current="page"] .sb-count{color:rgba(0,42,0,.7)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;text-align:center;line-height:18px}
.sb-item .badge{margin-left:auto}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px}
.sb-sync{display:flex;align-items:center;gap:6px;border-top:.5px solid rgba(255,255,255,.18);padding:10px 0 0 10px;font-size:13px;color:#fff}
.sb-sync-text{flex:1;min-width:0}
.sb-sync-sub{color:rgba(255,255,255,.62);margin-top:1px}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--accent);border-radius:10px;cursor:pointer;padding:0;flex:none}
.icon-btn:hover{background:var(--soft)}
.sb-sync .icon-btn{color:var(--lime)}
.sb-sync .icon-btn:hover{background:rgba(255,255,255,.08)}
.app{width:100%;max-width:1520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 2px) max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.topbar .side{display:flex;align-items:center;gap:2px}
.mbrand{display:flex;align-items:center;gap:10px}
.mbrand img{width:36px;height:36px;border-radius:9px;background:#fff;padding:2px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.mbrand .t1{letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-size:11px;font-weight:700}
.mbrand .t2{font-size:15px;font-weight:700;line-height:1.1}
.large-title{margin:6px 0 2px;font-size:34px;font-weight:700;line-height:41px;letter-spacing:.3px}
.asof{color:var(--muted);font-size:14px}
.asof b{color:var(--ink);font-weight:600}
.asof .past{color:var(--accent);font-weight:600}
.filters{display:grid;gap:10px;margin:16px 0 4px;max-width:900px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:42px;background:var(--fill);border-radius:10px;padding:0 12px;color:var(--muted);position:relative}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--ink);padding:0}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search .kbd{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--muted)}
@media (max-width:1023px),(hover:none){.search .kbd{display:none}}
.search .clear{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 4px}
.sugg{position:absolute;top:46px;left:0;right:0;background:var(--panel);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.22);z-index:40;padding:6px;max-height:min(60vh,440px);overflow:auto;color:var(--ink)}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:15px}
.sugg button:hover,.sugg button.on{background:var(--accent-soft)}
.sugg .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:72px;flex:none}
.sugg .s{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}
.sugg .none{padding:10px;color:var(--muted)}
.filternote{font-size:13px;color:var(--muted)}
.filternote b{color:var(--ink)}
.segmented,.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.segmented{display:flex}
.segmented button,.seg button{flex:1;white-space:nowrap;border:0;background:none;border-radius:7px;height:32px;padding:0 14px;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer}
.seg button{height:28px;font-size:13px;padding:0 12px;flex:none}
.segmented button:disabled,.seg button:disabled{opacity:.4;cursor:default}
.segmented button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:var(--shadow);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);white-space:nowrap;border-radius:16px;height:32px;padding:0 12px;font-size:14px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
select.chip{width:auto;max-width:100%;appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:space-around;padding:7px 0 calc(env(safe-area-inset-bottom,0px) + 4px);min-height:50px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--line)}
.tabbar a,.tabbar button{flex:1;min-width:0;max-width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);text-decoration:none;border:0;background:none;padding:0;cursor:pointer;position:relative}
.tabbar [aria-current="page"]{color:var(--accent);font-weight:600}
.tabbar .badge{position:absolute;top:-4px;left:calc(50% + 6px)}
dialog.more{border:0;border-radius:14px 14px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 10px);margin:auto 0 0;width:100%;max-width:100%;background:var(--panel);color:var(--ink)}
dialog.more::backdrop{background:rgba(0,0,0,.35)}
dialog.more a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--ink);text-decoration:none;font-size:17px}
dialog.more a svg{color:var(--accent)}
dialog.more a[aria-current="page"]{font-weight:600;color:var(--accent-ink)}
@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start}
  .sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);color:#fff;padding:18px 12px 14px}
  .tabbar,.mbrand,.m-only{display:none!important}
  .app{padding:4px 28px 64px}
}
@media (min-width:1024px) and (max-width:1365px){.shell{grid-template-columns:208px minmax(0,1fr)}.sb-logo{width:40px;height:40px;border-radius:9px}.sb-main{font-size:15px}.app{padding-inline:16px}}

/* ---- content */
section.page{display:grid;gap:16px;padding-top:14px}
h2{font-size:20px;font-weight:700;margin:0;letter-spacing:.1px}
h3{font-size:16px;font-weight:650;margin:0}
.lead{color:var(--muted);margin:3px 0 0;max-width:80ch;font-size:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.split{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.card{background:var(--panel);border-radius:12px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.card.attn{box-shadow:inset 4px 0 0 var(--warn),var(--shadow)}
.cardhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.note{color:var(--muted);font-size:12.5px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
@media (min-width:1280px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .val{font-weight:700;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .val small{font-size:15px;font-weight:600;color:var(--muted);margin-left:3px}
.big{font-weight:700;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.arrow{color:var(--muted);margin:0 6px}
.delta{font-size:12.5px;font-variant-numeric:tabular-nums}
.up-good,.down-good{color:var(--good)} .up-bad,.down-bad{color:var(--bad)} .flat{color:var(--muted)}
.tablebox{overflow-x:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:.5px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.2px;vertical-align:bottom;white-space:nowrap;line-height:14px;padding-top:10px}
th .unit{display:block;font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;margin-top:2px}
td.num,th.num{text-align:right;white-space:nowrap}
tbody tr:last-child>td{border-bottom:0}
th.hl,td.hl{background:var(--accent-soft);color:var(--accent-ink)}
td.hl{font-weight:700}
tr.sub td{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.muted{background:var(--soft);color:var(--muted)}
.pill.lime{background:var(--accent-soft);color:var(--accent-ink)}
.alerts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
.assign{display:grid;gap:10px}
.assign .row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--line)}
.assign .row:last-child{border-bottom:0}
.assign .name{font-family:var(--f-mono);font-size:13px;word-break:break-word}
.assign .meta{color:var(--muted);font-size:12px}
select,input[type=text]{font:inherit;font-size:14px;padding:7px 10px;border:0;border-radius:8px;background:var(--fill);color:var(--ink);min-width:0;width:100%}
input[type=number]{font:inherit;font-size:14px;padding:6px 8px;border:0;border-radius:8px;background:var(--fill);color:var(--ink);width:100px;font-variant-numeric:tabular-nums}
button.primary{font:inherit;font-size:14px;font-weight:600;padding:7px 16px;border-radius:8px;border:0;background:var(--brand);color:#fff;cursor:pointer}
:root[data-theme="dark"] button.primary{background:var(--lime);color:#002a00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{background:var(--lime);color:#002a00}}
button.primary:disabled{opacity:.45;cursor:default}
button.ghost{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:5px 12px;cursor:pointer}
.saved{color:var(--good);font-size:12.5px}
.err{color:var(--bad);font-size:12.5px}
@media (max-width:640px){.assign .row{grid-template-columns:1fr}}
svg text{font-family:var(--f-body)}
.chart{width:100%;height:auto;display:block}
@media (min-width:1024px){.chart{max-width:1080px;margin-inline:auto}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg svg{flex:none}
.why{font-size:13px;color:var(--ink);margin:4px 0 0}
.mono{font-family:var(--f-mono);font-size:12.5px}
.loading{padding:40px 0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){section.page{animation:fade .2s ease-out}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.mv{white-space:nowrap}
.mv .v{font-weight:600}
.mv .v .mk{font-weight:700;margin-left:3px;color:var(--bad)}
.mv .ref{font-size:12px;color:var(--muted);margin-top:1px}
.mv .ref .miss{color:var(--bad);font-weight:600;text-decoration:underline;text-underline-offset:2px}
td.mvc{text-align:right}
.unit{font-weight:400;color:var(--muted)}
.keyline{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:10px}
.keyline b{color:var(--bad);font-weight:700}
.keyline u{color:var(--bad);text-underline-offset:2px}
button.link{font:inherit;font-size:13px;border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 0;text-align:left;font-weight:600}
button.drill{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:3px 10px;cursor:pointer;white-space:nowrap}
button.drill[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
tr.drillrow>td{background:var(--bg);padding:10px 12px}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--soft)}
tr.pick.sel td{background:var(--accent-soft)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar label{font-size:12.5px;color:var(--muted)}
.toolbar select{width:auto;min-width:180px}
.tg td{vertical-align:middle}
.tg .hint{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
.scopenote{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 12px}
details.collapsible>summary{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;cursor:pointer;list-style:none}
details.collapsible>summary::-webkit-details-marker{display:none}
details.collapsible>summary h3::before{content:"▸";display:inline-block;width:14px;transition:transform .15s}
details.collapsible[open]>summary h3::before{transform:rotate(90deg)}
details.collapsible[open]>summary{margin-bottom:10px}
/* clickable figures: benchmark / best values, loom numbers, head groups */
button.bmb,button.lk,button.hgl{font:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit;color:var(--accent);text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:3px}
button.bmb.miss{color:var(--bad);font-weight:600;text-decoration:underline solid}
button.bmb.best{color:var(--info)}
button.lk{font-weight:700;color:var(--ink);text-decoration-color:var(--muted-2)}
button.hgl{font-weight:600;color:var(--ink);text-decoration-color:var(--muted-2)}
button.bmb:hover,button.lk:hover,button.hgl:hover{text-decoration-style:solid;color:var(--accent)}
svg .lkt{cursor:pointer}
svg .lkt:hover{text-decoration:underline}
/* drill-down panel (benchmark / loom / head group): right-hand drawer on laptops, sheet on phones */
dialog.bmp{width:min(1100px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow-x:hidden;padding:0;border:0;border-radius:14px;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.bmp::backdrop{background:rgba(0,0,0,.38)}
.bmp .hd{position:sticky;top:0;z-index:2;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);padding:12px 16px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.bmp .hd .ttl{min-width:0;flex:1}
.bmp .hd h2{font-size:22px}
.bmp .bd{padding:14px 16px 24px;display:grid;gap:14px}
.bmp .bd>*{min-width:0}
td.d{white-space:nowrap}
.bmp .x,.bmp .back{font-size:15px;line-height:1;border:0;background:var(--fill);color:var(--ink);border-radius:16px;height:32px;min-width:32px;padding:0 10px;cursor:pointer;flex:none}
.bmp .back{color:var(--accent);font-weight:600}
.bmp table{font-size:13.5px}
.bmp tr.brk td{font-weight:600}
.bmp tr.mark td{padding:4px 12px;background:var(--brand);color:#fff;font-size:12px;font-weight:600}
.formula{font-family:var(--f-mono);font-size:12.5px;background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:8px}
.card .formula{background:var(--bg)}
.bmp .card .formula{background:var(--soft)}
.sw{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (min-width:1024px){
  dialog.bmp{width:min(1100px,80vw);height:100vh;max-height:100vh;margin:0 0 0 auto;border-radius:14px 0 0 14px;overflow-y:auto}
  dialog.bmp::backdrop{background:rgba(0,0,0,.28)}
}
@media (max-width:1023px){
  dialog.bmp{width:100vw;max-width:100vw;height:calc(100vh - 28px);max-height:none;margin:auto 0 0;border-radius:14px 14px 0 0;overflow-y:auto}
}
@media (min-width:1024px) and (prefers-reduced-motion:no-preference){dialog.bmp[open]{animation:drawer .18s ease-out}}
@keyframes drawer{from{transform:translateX(28px);opacity:.5}to{transform:none;opacity:1}}
/* Benchmarks tab */
.bench-layout{display:grid;gap:16px}
@media (min-width:1180px){.bench-layout{grid-template-columns:minmax(300px,380px) minmax(0,1fr);align-items:start}.bench-list{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.bench-list .search{margin-bottom:10px}
.qrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 8px;border-radius:8px;cursor:pointer;color:var(--ink);position:relative}
.qrow+.qrow::before{content:"";position:absolute;top:0;left:8px;right:0;border-top:.5px solid var(--line)}
.qrow:hover{background:var(--soft)}
.qrow[aria-pressed="true"]{background:var(--accent-soft)}
.qrow[aria-pressed="true"]::before,.qrow[aria-pressed="true"]+.qrow::before{display:none}
.qrow .qn{font-weight:600;font-size:15px}
.qrow .qs{color:var(--muted);font-size:12.5px}
.qrow .qv{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.qdot{width:10px;height:10px;border-radius:3px;flex:none}
/* sign-in */
.gate{max-width:380px;margin:12vh auto 0;padding:24px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);display:grid;gap:12px;text-align:center;justify-items:center}
.gate>*{max-width:100%}
.gate input{font:inherit;font-family:var(--f-mono);font-size:16px;padding:10px 12px;border:0;border-radius:10px;background:var(--fill);color:var(--ink);width:100%;letter-spacing:.06em}
.gate button{font:inherit;font-size:16px;font-weight:600;padding:11px 14px;border-radius:10px;border:0;background:var(--brand);color:#fff;cursor:pointer;width:100%}
.gate .note,.gate .err{text-align:left;width:100%}
.gate-logo{display:block;width:72px;height:72px;background:#fff;border-radius:16px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.guide p{margin:0 0 8px;max-width:75ch}
.guide h3{margin:12px 0 4px}

<body>
<div class="shell">
  <aside class="sidebar" aria-label="Navigation">
    <div class="sb-brand">
      <img class="sb-logo" src="logo.svg" alt="Hanuman" width="46" height="46">
      <div><div class="sb-top">Hanuman</div><div class="sb-main">Weavelon 2 Looms</div></div>
    </div>
    <nav class="sb-nav" id="sbnav" aria-label="Pages"></nav>
    <div class="sb-foot">
      <a class="sb-item" href="#data" data-tab="data" id="sb-data"></a>
      <button type="button" class="sb-item" id="sb-guide"></button>
      <div class="sb-sync"><div class="sb-sync-text"><div id="sync1">Loom data</div><div class="sb-sync-sub" id="sync2">Loading…</div></div>
        <button type="button" class="icon-btn" id="refresh" title="Reload the latest data" aria-label="Reload the latest data"></button></div>
    </div>
  </aside>
  <div class="app">
    <div class="topbar">
      <div class="side">
        <div class="mbrand"><img src="logo.svg" alt="Hanuman" width="36" height="36"><div><div class="t1">Hanuman</div><div class="t2">Weavelon 2 Looms</div></div></div>
        <button type="button" class="icon-btn" id="theme" title="Light or dark" aria-label="Switch light or dark"></button>
        <button type="button" class="icon-btn" id="help" title="Guide" aria-label="Guide"></button>
      </div>
      <div class="side">
        <button type="button" class="icon-btn m-only" id="refresh-m" title="Reload the latest data" aria-label="Reload the latest data"></button>
      </div>
    </div>
    <h1 class="large-title" id="ptitle">Loom Performance</h1>
    <div class="asof" id="asof">Loading the latest day…</div>
    <div class="filters">
      <div class="search" id="gsearch" role="search"><span id="gs-icon" aria-hidden="true"></span>
        <input type="search" id="q" placeholder="Search loom or head group" autocomplete="off" spellcheck="false" aria-label="Search loom number or head group" aria-autocomplete="list" aria-controls="sugg">
        <button type="button" class="clear" id="q-clear" aria-label="Clear search" hidden>×</button><span class="kbd" id="q-kbd" aria-hidden="true">/</span>
        <div class="sugg" id="sugg" role="listbox" hidden></div></div>
      <div class="segmented" role="group" aria-label="Loom width">
        <button type="button" data-w="190" aria-pressed="true">190 cm</button>
        <button type="button" data-w="280" aria-pressed="false">280 cm</button>
        <button type="button" data-w="all" aria-pressed="false">Both widths</button>
      </div>
      <div class="frow"><select class="chip day" id="day" aria-label="View date" title="Show the app as it stood on an earlier day"></select><span class="filternote" id="fnote"></span></div>
    </div>
    <main id="main"><div class="loading">Loading loom data…</div></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Pages"></nav>
<dialog class="more" id="more" aria-label="More pages"></dialog>
<script>
(() => {
'use strict';
let D = null, W = '190', TAB = 'actions';
let db = null, assigned = {}, TG = {}, targetsLoaded = false;
const BM = new Map();
// view state
const OPEN = new Set(); const SHOWALL = {};
let ASSIGN_OPEN = null; // null = automatic: open while any name is unsaved
let PMODE = 'bm', PVIEW = 'loom', PALL = false, CMODE = 'bm', CVIEW = 'loom', CALL = false, WPER = 'day', WQ = '', TREND_METRIC = 'eff', TREND_HL = '';
// thresholds set in this page (the rest come from the Config Sheet's Settings tab)
const PRESS_TOL = 0.1;      // kgf/cm² over benchmark or target before a loom is listed
const OFF_LONG = 240;       // minutes powered down in the day
const LOW_EFF_DAYS = 3, LOW_EFF_WINDOW = 5;
const KGF = 0.980665, PATM = 1.01325;

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const ok = (x) => x != null && isFinite(x);
const f0 = (x) => !ok(x) ? '—' : Math.round(x).toLocaleString('en-IN');
const f1 = (x) => !ok(x) ? '—' : x.toFixed(1);
const f2 = (x) => !ok(x) ? '—' : x.toFixed(2);
const f3 = (x) => !ok(x) ? '—' : x.toFixed(3);
// Pick counts are shown in lakh picks after dividing the machine count by 39.37 (rates such as RPM stay on raw picks)
const PICK_LAKH = 39.37 * 1e5;
const dfmt = (d) => d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', {day: 'numeric', month: 'short', timeZone: 'UTC'}) : '—';
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const inW = (w) => W === 'all' || String(w) === W;
const wLabel = () => W === 'all' ? '190 + 280 cm' : W + ' cm';
const key = (w, hg) => w + '|' + hg;
const bench = (w, hg) => BM.get(key(w, hg)) || null;
const tgt = (w, hg) => TG[key(w, hg)] || null;
const tgtId = (w, hg) => (w + '__' + hg).replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 150);
const S = () => D.settings || {};
const UNITS = {rpm: 'RPM', eff: '%', cfm: 'CFM (ft³/min)', apk: 'ft³ / 1,000 picks', main: 'kgf/cm²', warp: 'breaks', warpRate: 'per 100k picks'};

// ---------------------------------------------------------------- Double panna
// 280 cm looms weave two panels side by side, so each machine pick makes two fabric picks. Default: double panna for every
// 280 cm head group; a head group can be switched to single panna (saved in the Config Sheet's App targets tab as a panna__ row).
// Fabric picks drive "Picks" and air per 1,000 picks. RPM, CFM and warp-break rate stay on the machine's own picks.
let SINGLE = new Set(), pannaLoaded = false;
const pf = (w, hg) => String(w) === '280' && !SINGLE.has(hg) ? 2 : 1;
const pannaId = (w, hg) => 'panna__' + tgtId(w, hg);
// Re-derive fabric picks and air per 1,000 picks for the current switches. Idempotent: loom-day records keep machine picks and air;
// benchmark air figures are rescaled from the panna the pipeline applied when it computed them (old data: none applied).
function applyPanna(data) {
  if (!data) return;
  const fix = (x, w, hg) => { if (!x) return; const f = pf(w, hg); x.fpicks = (x.picks || 0) * f; x.apk = x.fpicks && ok(x.air) ? 1000 * x.air / x.fpicks : null; };
  for (const x of data.loomdays || []) fix(x, x.width, x.hg);
  for (const b of data.benchmarks || []) {
    if (!b._o) b._o = {pf: ok(b.panna) ? b.panna : 1, apk: b.apk, best_apk: b.best_apk, cur_apk: b.cur_apk, rv: b.runs && b.runs.apk ? b.runs.apk.value : null};
    const s = b._o.pf / pf(b.width, b.hg);
    b.apk = ok(b._o.apk) ? b._o.apk * s : b._o.apk; b.best_apk = ok(b._o.best_apk) ? b._o.best_apk * s : b._o.best_apk;
    b.cur_apk = ok(b._o.cur_apk) ? b._o.cur_apk * s : b._o.cur_apk;
    for (const R of Object.values(b.runs || {})) for (const r of [R.lo, R.hi, R.best, ...(R.top || [])]) fix(r, b.width, b.hg);
    if (b.runs && b.runs.apk && ok(b._o.rv)) b.runs.apk.value = b._o.rv * s;
  }
}
// Benchmark CFM for a loom-day = benchmark air per 1,000 fabric picks × panna × the loom's RPM ÷ 1,000 (CFM itself is never doubled).
const cfmOf = (apk, w, hg, rpm) => ok(apk) && ok(rpm) && rpm > 0 ? apk * pf(w, hg) * rpm / 1000 : null;

function agg(L) {
  let picks = 0, fpicks = 0, run = 0, stop = 0, air = 0, warp = 0, mw = 0, mmax = 0; const looms = new Set();
  for (const x of L) {
    picks += x.picks || 0; fpicks += ok(x.fpicks) ? x.fpicks : (x.picks || 0); run += x.run || 0; stop += x.stop || 0; air += x.air || 0; warp += x.warp || 0;
    mw += (x.main || 0) * (x.run || 0); mmax = Math.max(mmax, x.main_max || 0); looms.add(x.loom);
  }
  if (!run || !picks) return null;
  return {looms: looms.size, picks, fpicks, run, stop, air, warp, rpm: picks / run, eff: 100 * run / (run + stop),
    apk: 1000 * air / fpicks, cfm: air / run, main: mw / run, main_max: mmax, warpRate: warp / picks * 1e5};
}

// ---------------------------------------------------------------- Best loom-day
// The single best loom-day behind each benchmark: fastest RPM, lowest air per 1,000 picks, lowest pressure.
// New data carries it with the benchmark (all history); older data falls back to the loom-days kept on this page.
const BEST_OK = {rpm: 1, apk: 1, main_max: 1, main: 1};
function bestRec(w, hg, m) {
  const b = bench(w, hg); if (!b || !BEST_OK[m]) return null;
  const R = b.runs && b.runs[m];
  if (R && R.best) return R.best;
  const hi = m === 'rpm';
  const L = (D.loomdays || []).filter((x) => String(x.width) === String(w) && x.hg === hg && x.eligible && ok(x[m]) && (m !== 'main_max' || x[m] > 0));
  if (!L.length) return null;
  return L.reduce((a, x) => (hi ? x[m] > a[m] : x[m] < a[m]) ? x : a);
}
const bestVal = (w, hg, m) => { const r = bestRec(w, hg, m); return r ? r[m] : null; };
// Loom-days at or better than the benchmark, best first.
function betterRecs(w, hg, m) {
  const b = bench(w, hg); const R = b && b.runs && b.runs[m]; if (!R) return {list: [], n: 0, full: true};
  if (R.top) return {list: R.top, n: R.n_better != null ? R.n_better : R.top.length, full: (R.n_better || R.top.length) <= R.top.length};
  const hi = m === 'rpm';
  const L = (D.loomdays || []).filter((x) => String(x.width) === String(w) && x.hg === hg && x.eligible && ok(x[m]) && (m !== 'main_max' || x[m] > 0)
    && (hi ? x[m] >= R.value - 1e-9 : x[m] <= R.value + 1e-9)).sort((a, c) => hi ? c[m] - a[m] : a[m] - c[m]);
  return {list: L, n: L.length, full: false, local: true};
}
const latestRecs = (minRun = 60) => (D.loomdays || []).filter((x) => x.date === D.latest && x.run >= minRun && inW(x.width));
const priorDates = () => (D.complete_days || []).filter((d) => d < D.latest).slice(-7);

function card(title, note, ...body) {
  return el('div', {class: 'card'}, el('div', {class: 'cardhead'}, el('h3', {text: title}), note ? el('span', {class: 'note', text: note}) : null), ...body);
}
function th(label, unit, num) { return el('th', {class: num ? 'num' : null, scope: 'col'}, label, unit ? el('span', {class: 'unit', text: unit}) : null); }
function table(headers, rows, numCols = []) {
  const t = el('table');
  t.append(el('thead', {}, el('tr', {}, headers.map((h, i) => Array.isArray(h) ? th(h[0], h[1], numCols.includes(i)) : th(h, null, numCols.includes(i))))));
  const tb = el('tbody');
  for (const r of rows) tb.append(r.nodeType ? r : el('tr', {}, r.map((c, i) => el('td', {class: numCols.includes(i) ? 'num' : null}, c))));
  t.append(tb);
  return el('div', {class: 'tablebox'}, t);
}
function moreButton(id, total, shown) {
  if (total <= shown && !SHOWALL[id]) return null;
  return el('button', {class: 'link', type: 'button', text: SHOWALL[id] ? 'Show fewer' : `Show all ${total}`, onclick: () => { SHOWALL[id] = !SHOWALL[id]; render(); }});
}
function delta(cur, prev, goodUp, fmt = (x) => x.toFixed(1), unit = '') {
  if (!ok(cur) || !ok(prev)) return el('span', {class: 'delta flat', text: 'no prior days'});
  const d = cur - prev;
  if (Math.abs(d) < 1e-9) return el('span', {class: 'delta flat', text: '±0 vs prior days'});
  const good = goodUp ? d > 0 : d < 0;
  return el('span', {class: 'delta ' + (good ? 'up-good' : 'up-bad'), text: (d > 0 ? '▲ +' : '▼ −') + fmt(Math.abs(d)) + unit + ' vs prior-days avg'});
}
function benchTag(b) {
  if (!b) return el('span', {class: 'pill muted', text: 'no benchmark'});
  const m = {published: ['good', 'benchmark'], 'single-loom': ['info', 'single loom'], provisional: ['warn', 'provisional']};
  const [c, t] = m[b.status] || ['muted', b.status || 'none'];
  return el('span', {}, el('span', {class: 'pill ' + c, text: t}), el('div', {class: 'note', text: `${b.n} loom-days · ${b.dates} dates · ${b.looms} looms`}));
}
// A metric cell: current value, then "bm x · tgt y". Missed references are underlined in red and the value gets ▼/▲.
function mcell(now, bm, tg, fmt, higherBetter, tolBm, tolTg, ref) {
  const missB = ok(now) && ok(bm) && (higherBetter ? now < bm - tolBm(bm) : now > bm + tolBm(bm));
  const missT = ok(now) && ok(tg) && (higherBetter ? now < tg - (tolTg ? tolTg(tg) : 0) : now > tg + (tolTg ? tolTg(tg) : 0));
  const mk = (missB || missT) ? el('span', {class: 'mk', 'aria-label': higherBetter ? 'below reference' : 'above reference', text: higherBetter ? '▼' : '▲'}) : null;
  const refs = [];
  refs.push(ref && ok(bm) ? bmBtn('bm ' + fmt(bm), ref.w, ref.hg, ref.m, {miss: missB, view: ref.view, rpm: ref.rpm}) : el('span', {class: missB ? 'miss' : null, text: 'bm ' + fmt(bm)}));
  if (ref && BEST_OK[ref.m]) {
    let bv = bestVal(ref.w, ref.hg, ref.m);
    if (ref.view === 'cfm') bv = cfmOf(bv, ref.w, ref.hg, ref.rpm);
    if (ok(bv)) refs.push(' · ', bmBtn('best ' + fmt(bv), ref.w, ref.hg, ref.m, {kind: 'best', view: ref.view, rpm: ref.rpm}));
  }
  if (ok(tg)) refs.push(' · ', el('span', {class: missT ? 'miss' : null, text: 'tgt ' + fmt(tg)}));
  return el('div', {class: 'mv'}, el('div', {class: 'v'}, fmt(now), mk), el('div', {class: 'ref'}, refs));
}
const tolRpm = (r) => r * (S().tol_rpm_pct || 3) / 100;
const EFF_BAD = () => ok(S().eff_bad_below) ? S().eff_bad_below : 90;
// Efficiency has no benchmark: any loom below the fixed line (Config Sheet, eff_bad_below) is bad.
function effCell(now) {
  const bad = ok(now) && now < EFF_BAD();
  return el('div', {class: 'mv'}, el('div', {class: 'v'}, f1(now), bad ? el('span', {class: 'mk', 'aria-label': 'below the line', text: '▼'}) : null),
    el('div', {class: 'ref'}, el('span', {class: bad ? 'miss' : null, text: `line ${f0(EFF_BAD())}`})));
}
const tolAir = (r) => r * (S().tol_air_pct || 5) / 100;
const tolP = () => PRESS_TOL;
function keyline(extra) {
  return el('div', {class: 'keyline'},
    el('span', {}, `bm = benchmark (90th percentile for RPM, 10th for air and pressure, all history) · best = the single best loom-day · click either to see the loom-days behind it · tgt = your target · line = efficiency below ${f0(EFF_BAD())}% is bad, whatever the quality`),
    el('span', {}, 'Loom numbers and head groups are clickable too. 280 cm picks and air per 1,000 picks count double panna unless switched to single.'),
    el('span', {}, el('b', {text: '▼ ▲'}), ' worse than a reference by more than its tolerance; the missed one is ', el('u', {text: 'underlined'})),
    extra ? el('span', {text: extra}) : null);
}

// ---------------------------------------------------------------- Drill-down panel (benchmark, best, loom, head group)
const BMETA = {
  rpm: {label: 'RPM', unit: 'picks/min', fmt: (x) => f0(x), best: 'high'},
  apk: {label: 'Air per 1,000 picks', unit: 'ft³ / 1,000 picks', fmt: (x) => f1(x), best: 'low'},
  main_max: {label: 'Main pressure (day max)', unit: 'kgf/cm²', fmt: (x) => f2(x), best: 'low'},
  main: {label: 'Main pressure (run-weighted avg)', unit: 'kgf/cm²', fmt: (x) => f2(x), best: 'low'},
  warp_rate: {label: 'Warp break rate (median)', unit: 'per 100k picks', fmt: (x) => f2(x), best: 'low'}};
const pkey = (b) => b && ok(b.main_max) ? 'main_max' : 'main';
const stopKey = (e) => e.stopPropagation();
const pctText = (p) => p === 50 ? 'median' : `${f0(p)}th percentile`;
// A benchmark or best figure that opens the loom-days behind it. view 'cfm' shows the air figure as CFM.
function bmBtn(text, w, hg, m, opts = {}) {
  const b = bench(w, hg); const best = opts.kind === 'best';
  if (!b || !b.runs || !b.runs[m] || (best && !bestRec(w, hg, m))) return el('span', {class: opts.miss ? 'miss' : null, text});
  return el('button', {type: 'button', class: 'bmb' + (opts.miss ? ' miss' : '') + (best ? ' best' : ''), text,
    title: best ? 'See the best loom-day' : 'See the loom-days behind this benchmark',
    'aria-label': `${text}: show the ${best ? 'best loom-day' : 'loom-days behind the benchmark'} for ${BMETA[m].label}, ${hg}, ${w} cm`,
    onclick: (e) => { e.stopPropagation(); openBm(w, hg, m, opts); }, onkeydown: stopKey});
}
// Loom numbers and head groups anywhere on the page open their own details for the date shown.
function loomLink(loom, date, label) {
  return el('button', {type: 'button', class: 'lk', 'data-loom': String(loom), text: label != null ? label : String(loom), title: `Loom ${loom}: details`,
    'aria-label': `Loom ${loom}: show details`, onclick: (e) => { e.stopPropagation(); openLoom(+loom, date || D.latest); }, onkeydown: stopKey});
}
function hgLink(hg, w, date, label) {
  if (!hg || hg === 'Unassigned' || hg === '—') return el('span', {'data-hg': hg || '', text: label || hg || '—'});
  return el('button', {type: 'button', class: 'hgl', 'data-hg': hg, text: label || hg, title: `${hg}: benchmark and looms`,
    'aria-label': `${hg}${w ? ', ' + w + ' cm' : ''}: show benchmark and looms`, onclick: (e) => { e.stopPropagation(); openHg(hg, w, date || D.latest); }, onkeydown: stopKey});
}
// Turn "Loom 12" in alert text into a link.
function linkify(text, date) {
  const parts = String(text).split(/(\b[Ll]oom \d{1,2}\b)/);
  return parts.map((p) => { const m = /^[Ll]oom (\d{1,2})$/.exec(p); return m && (D.machine || {})[m[1]] ? loomLink(+m[1], date, p) : p; });
}

let dlg = null; const STACK = [];
function panelEl() {
  if (!dlg) {
    dlg = el('dialog', {class: 'bmp', 'aria-labelledby': 'bmp-t'});
    dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener('close', () => { STACK.length = 0; });
    document.body.append(dlg);
  }
  return dlg;
}
function pushView(fn) { const d = panelEl(); if (!d.open) STACK.length = 0; STACK.push(fn); drawPanel(); if (!d.open) d.showModal(); }
function drawPanel(keepScroll) {
  const d = panelEl(); if (!STACK.length) return;
  const y = d.scrollTop; const v = STACK[STACK.length - 1]();
  d.replaceChildren(
    el('div', {class: 'hd'},

// ---------------------------------------------------------------- Actions (latest day only)
function actionLists() {
  const L = latestRecs().filter((x) => x.hg !== 'Unassigned');
  const out = {rpm: [], eff: [], cfm: [], press: []};
  for (const x of latestRecs()) {
    if (!(x.eff < EFF_BAD())) continue;
    const b = bench(x.width, x.hg) || {};
    const lostMin = Math.max(0, EFF_BAD() / 100 * (x.run + x.stop) - x.run);
    const beam = ok(x.warp_rate) && x.warp_rate > Math.max((S().warp_multiple || 2) * (b.warp_med || 0), S().warp_min_rate || 3);
    out.eff.push({x, now: x.eff, gap: EFF_BAD() - x.eff, impact: lostMin * x.rpm * pf(x.width, x.hg) / PICK_LAKH, lostMin, beam});
  }
  const floor = (D.pressure.floor || []).slice(-1)[0];
  for (const x of L) {
    const b = bench(x.width, x.hg), t = tgt(x.width, x.hg) || {};
    if (!b) continue;
    // RPM
    const rB = b.rpm, rT = ok(t.rpm) ? t.rpm : null;
    const offRB = ok(rB) && x.rpm < rB - tolRpm(rB), offRT = ok(rT) && x.rpm < rT - tolRpm(rT);
    if (offRB || offRT) {
      const ref = Math.max(offRB ? rB : 0, offRT ? rT : 0);
      out.rpm.push({x, b, t, now: x.rpm, bm: rB, tg: rT, gap: ref - x.rpm, impact: (ref - x.rpm) * x.run * pf(x.width, x.hg) / PICK_LAKH});
    }

    const offCB = ok(cB) && x.cfm > cB + tolAir(cB), offCT = ok(cT) && x.cfm > cT + tolAir(cT);
    if (offCB || offCT) {
      const ref = Math.min(offCB ? cB : Infinity, offCT ? cT : Infinity);
      out.cfm.push({x, b, t, now: x.cfm, bm: cB, tg: cT, gap: x.cfm - ref, impact: (x.cfm - ref) * x.run});
    }

    const pB = ok(b.main_max) ? b.main_max : b.main, pT = ok(t.main) ? t.main : null;
    const offPB = ok(pB) && x.main_max > pB + PRESS_TOL, offPT = ok(pT) && x.main_max > pT + PRESS_TOL;

  if (D && !busyEditing('.tg') && !busyEditing('.assign') && !busyEditing('#gsearch')) { render(); if (dlg && dlg.open) drawPanel(true); }
}

function showGate(msg) {
  $('#asof').textContent = 'Locked';
  $('.filters').hidden = true;
  const inp = el('input', {type: 'text', id: 'pass', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: 'XXXX-XXXX-XXXX-XXXX', 'aria-label': 'Passcode'});
  const go = el('button', {type: 'submit', text: 'Open'});
  const form = el('form', {class: 'gate'}, el('img', {class: 'gate-logo', src: 'logo.svg', alt: 'Hanuman', width: '72', height: '72'}), el('h2', {text: 'Enter the app passcode'}),
    el('p', {class: 'note', style: 'margin:0', text: 'Asked once on each device. It unlocks the loom data and lets you save targets.'}),
    inp, msg ? el('p', {class: 'err', style: 'margin:0', text: msg}) : null, go);
  form.addEventListener('submit', (ev) => { ev.preventDefault(); const k = normKey(inp.value); if (!k) return; setKey(k); load(); });
  $('#main').replaceChildren(form);
  inp.focus();
}

async function fetchSealed(path, pass) {
  const r = await fetch(path + '?t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const sealed = await r.json();
  try { return JSON.parse(await openSealed(sealed, pass)); }
  catch (e) { const err = new Error('passcode'); err.passcode = true; throw err; }
}

function fillDays() {
  const sel = $('#day');
  const days = ((LATEST && LATEST.snapshots) || []).slice().reverse();
  sel.replaceChildren(...days.map((d, i) => el('option', {value: i === 0 ? '' : d, text: i === 0 ? `Latest · ${dfmt(d)}` : dfmt(d), selected: (i === 0 ? '' : d) === VIEW ? true : null})));
  sel.hidden = days.length < 2;
}

function show(data) {
  D = data;
  $('.filters').hidden = false;
  if (!pannaLoaded) SINGLE = new Set((D.panna && D.panna.single) || []);   // until the saved switches load
  applyPanna(D);
  BM.clear();
  for (const b of D.benchmarks || []) BM.set(key(b.width, b.hg), b);
  closePanel();
  const done = (D.days || []).filter((d) => d.status === 'complete').length;
  if (VIEW) {
    $('#asof').replaceChildren(el('span', {class: 'past', text: `Viewing ${dfmt(D.latest)}`}),
      ` as it stood that day · ${done} day${done === 1 ? '' : 's'} of history then`,
      el('button', {type: 'button', class: 'ghost', text: 'Back to latest', onclick: () => setView('')}));
  } else {
    $('#asof').replaceChildren('Latest complete day ', el('b', {text: dfmt(D.latest)}), ` · ${done} day${done === 1 ? '' : 's'} of history · updated ${D.generated_at} IST`);
  }
  $('#sync1').textContent = VIEW ? `Viewing ${dfmt(D.latest)}` : `Latest ${dfmt(D.latest)}`;
  $('#sync2').textContent = LATEST && LATEST.generated_at ? `Updated ${String(LATEST.generated_at).slice(5)} IST` : '';
  fillDays();
  render();
}

async function setView(d) {
  VIEW = d || '';
  if (!VIEW) { if (LATEST) show(LATEST); return; }
  const pass = getKey();
  if (SNAP.has(VIEW)) { show(SNAP.get(VIEW)); return; }
  $('#main').replaceChildren(el('div', {class: 'loading', text: `Loading ${dfmt(VIEW)}…`}));
  try {
    const v = await fetchSealed(`data/days/${VIEW}.enc.json`, pass);
    SNAP.set(VIEW, v);
    if (VIEW === d) show(v);
  } catch (e) {
    VIEW = '';
    if (LATEST) show(LATEST);
    $('#main').prepend(el('p', {class: 'err', text: `Could not load ${dfmt(d)}. Showing the latest day instead.`}));
  }
}

async function load(quiet) {
  if (loading) return;
  const pass = getKey();
  if (!pass) { showGate(); return; }
  loading = true;
  if (!quiet || !D) $('#main').replaceChildren(el('div', {class: 'loading', text: 'Loading loom data…'}));
  try {
    LATEST = await fetchSealed('data/data.enc.json', pass);
  } catch (e) {
    loading = false;
    if (e.passcode) { clearKey(); showGate('That passcode did not work. Check it and try again.'); return; }
    if (!D) $('#main').replaceChildren(el('div', {class: 'loading', text: 'Could not load the loom data. Check your connection and tap Refresh; if it persists, the daily run may have failed.'}));
    return;
  }
  loading = false;
  lastLoad = Date.now();
  SNAP.clear();
  if (VIEW && !(LATEST.snapshots || []).includes(VIEW)) VIEW = '';
  if (VIEW === (LATEST.snapshots || []).slice(-1)[0]) VIEW = '';
  if (API) { db = sheetDb; loadState(); } else { db = null; targetsLoaded = true; }
  if (VIEW) setView(VIEW); else show(LATEST);
}
$('#day').addEventListener('change', (ev) => setView(ev.target.value));

// Data health page: a way to lock this device again.
const basePageData = PAGES.data;
PAGES.data = () => {
  const s = basePageData();
  s.append(el('p', {}, el('button', {class: 'ghost', type: 'button', text: 'Forget the passcode on this device', onclick: () => { clearKey(); location.reload(); }})));
  return s;
};

$('#refresh').addEventListener('click', () => load(true));
$('#refresh-m').addEventListener('click', () => load(true));
// The home-screen app stays in memory on iPhone; refetch when it comes back after a while.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !VIEW && Date.now() - lastLoad > 15 * 60e3) load(true); });
load();
})();
</script>

</body></html>
