<style>
/* Layout: sticky header with width switch and tabs; one page shown at a time; cards in auto-fit grids. */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#151a2b; --muted:#5c6378; --line:#dde0ea; --soft:#eceef4;

  --good:#1d7a4c; --good-soft:#e1f2e8; --warn:#9a6400; --warn-soft:#fbf0d9; --bad:#b4232c; --bad-soft:#fbe4e5;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#8f9dff; --accent-soft:#252c52; --thread:#f08a4b;
  --good:#5cc98f; --good-soft:#163326; --warn:#e6b450; --warn-soft:#342a12; --bad:#ff7a80; --bad-soft:#3a1b1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131c; --panel:#171b27; --ink:#e7e9f1; --muted:#9aa1b6; --line:#2a3042; --soft:#1f2433;
  --accent:#8f9dff; --accent-soft:#252c52; --thread:#f08a4b;
  --good:#5cc98f; --good-soft:#163326; --warn:#e6b450; --warn-soft:#342a12; --bad:#ff7a80; --bad-soft:#3a1b1e; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

svg text{font-family:var(--f-body)}

.split{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}

@media (prefers-reduced-motion:no-preference){section.page{animation:fade .25s ease-out}}

</style>
<style>

input[type=number]{font:inherit;font-family:var(--f-mono);font-size:13px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:96px}

/* Benchmark run panel */
button.bmb{font:inherit;border:0;background:none;padding:0;margin:0;color:var(--accent);cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}

<body>
<div class="wrap">
  <header class="top">
    <div class="titlerow">
      <div>
        <h1>Weavelon 2 Loom Performance</h1>
        <div class="asof" id="asof">Loading the latest day…</div>
      </div>
      <div class="controls">
        <button type="button" class="ghost" id="refresh" title="Reload the latest data">Refresh</button>
        <div class="seg" role="group" aria-label="Loom width">
          <button type="button" id="w190" data-w="190" aria-pressed="true">190 cm</button>
          <button type="button" id="w280" data-w="280" aria-pressed="false">280 cm</button>
          <button type="button" id="wall" data-w="all" aria-pressed="false">Both</button>
        </div>
      </div>
    </div>
    <nav class="tabs" aria-label="Pages">
      <a href="#actions" data-tab="actions">Actions <span class="count" id="cnt-assign" hidden></span></a>
      <a href="#quality" data-tab="quality">Quality</a>
      <a href="#pressure" data-tab="pressure">Pressure</a>
      <a href="#cfm" data-tab="cfm">CFM</a>
      <a href="#utilisation" data-tab="utilisation">Utilisation</a>
      <a href="#warp" data-tab="warp">Warp breaks</a>
      <a href="#trends" data-tab="trends">Trends</a>
      <a href="#targets" data-tab="targets">Targets</a>
      <a href="#data" data-tab="data">Data health</a>
    </nav>
  </header>

  <main id="main"><div class="loading">Loading loom data…</div></main>
</div>

<script>
(() => {
'use strict';
let D = null, W = '190', TAB = 'actions';
let db = null, assigned = {}, TG = {}, targetsLoaded = false;
const BM = new Map();
// view state
const OPEN = new Set(); const SHOWALL = {};
let ASSIGN_OPEN = null; // null = automatic: open while any name is unsaved
let PMODE = 'bm', PVIEW = 'loom', PALL = false, CMODE = 'bm', CVIEW = 'loom', CALL = false, WPER = 'day', WQ = '', TREND_METRIC = 'eff', TREND_HL = '';
// thresholds set in this page (the rest come from the Config Sheet's Settings tab)
const PRESS_TOL = 0.1;      // kgf/cm² over benchmark or target before a loom is listed
const OFF_LONG = 240;       // minutes powered down in the day
const LOW_EFF_DAYS = 3, LOW_EFF_WINDOW = 5;
const KGF = 0.980665, PATM = 1.01325;

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const ok = (x) => x != null && isFinite(x);
const f0 = (x) => !ok(x) ? '—' : Math.round(x).toLocaleString('en-IN');
const f1 = (x) => !ok(x) ? '—' : x.toFixed(1);
const f2 = (x) => !ok(x) ? '—' : x.toFixed(2);
const dfmt = (d) => d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', {day: 'numeric', month: 'short', timeZone: 'UTC'}) : '—';
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const inW = (w) => W === 'all' || String(w) === W;
const wLabel = () => W === 'all' ? '190 + 280 cm' : W + ' cm';
const key = (w, hg) => w + '|' + hg;
const bench = (w, hg) => BM.get(key(w, hg)) || null;
const tgt = (w, hg) => TG[key(w, hg)] || null;
const tgtId = (w, hg) => (w + '__' + hg).replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 150);
const S = () => D.settings || {};
const UNITS = {rpm: 'RPM', eff: '%', cfm: 'CFM (ft³/min)', apk: 'ft³ / 1,000 picks', main: 'kgf/cm²', warp: 'breaks', warpRate: 'per 100k picks'};

function agg(L) {
  let picks = 0, run = 0, stop = 0, air = 0, warp = 0, mw = 0, mmax = 0; const looms = new Set();
  for (const x of L) {
    picks += x.picks || 0; run += x.run || 0; stop += x.stop || 0; air += x.air || 0; warp += x.warp || 0;
    mw += (x.main || 0) * (x.run || 0); mmax = Math.max(mmax, x.main_max || 0); looms.add(x.loom);
  }
  if (!run || !picks) return null;
  return {looms: looms.size, picks, run, stop, air, warp, rpm: picks / run, eff: 100 * run / (run + stop),
    apk: 1000 * air / picks, cfm: air / run, main: mw / run, main_max: mmax, warpRate: warp / picks * 1e5};
}
const latestRecs = (minRun = 60) => (D.loomdays || []).filter((x) => x.date === D.latest && x.run >= minRun && inW(x.width));
const priorDates = () => (D.complete_days || []).filter((d) => d < D.latest).slice(-7);

function card(title, note, ...body) {
  return el('div', {class: 'card'}, el('div', {class: 'cardhead'}, el('h3', {text: title}), note ? el('span', {class: 'note', text: note}) : null), ...body);
}
function th(label, unit, num) { return el('th', {class: num ? 'num' : null, scope: 'col'}, label, unit ? el('span', {class: 'unit', text: unit}) : null); }
function table(headers, rows, numCols = []) {
  const t = el('table');
  t.append(el('thead', {}, el('tr', {}, headers.map((h, i) => Array.isArray(h) ? th(h[0], h[1], numCols.includes(i)) : th(h, null, numCols.includes(i))))));
  const tb = el('tbody');
  for (const r of rows) tb.append(r.nodeType ? r : el('tr', {}, r.map((c, i) => el('td', {class: numCols.includes(i) ? 'num' : null}, c))));
  t.append(tb);
  return el('div', {class: 'tablebox'}, t);
}
function moreButton(id, total, shown) {
  if (total <= shown && !SHOWALL[id]) return null;
  return el('button', {class: 'link', type: 'button', text: SHOWALL[id] ? 'Show fewer' : `Show all ${total}`, onclick: () => { SHOWALL[id] = !SHOWALL[id]; render(); }});
}
function delta(cur, prev, goodUp, fmt = (x) => x.toFixed(1), unit = '') {
  if (!ok(cur) || !ok(prev)) return el('span', {class: 'delta flat', text: 'no prior days'});
  const d = cur - prev;
  if (Math.abs(d) < 1e-9) return el('span', {class: 'delta flat', text: '±0 vs prior days'});
  const good = goodUp ? d > 0 : d < 0;

// ---------------------------------------------------------------- KPIs
function kpiSet(dates) {
  const L = (D.loomdays || []).filter((x) => dates.includes(x.date) && inW(x.width) && x.run > 0);
  const A = agg(L); if (!A) return null;
  const n = dates.length;
  const off = (D.util || []).filter((u) => dates.includes(u.date) && inW(u.width)).reduce((s, u) => s + u.off, 0);
  return {picks_m: A.picks / 1e6 / n, eff: A.eff, rpm: A.rpm, apk: A.apk, cfm: A.cfm, floor_cfm: A.air / 1440 / n, air: A.air / n, off_h: off / 60 / n};
}

// ---------------------------------------------------------------- Actions (latest day only)
function actionLists() {
  const L = latestRecs().filter((x) => x.hg !== 'Unassigned');
  const out = {rpm: [], eff: [], cfm: [], press: []};
  for (const x of latestRecs()) {
    if (!(x.eff < EFF_BAD())) continue;
    const b = bench(x.width, x.hg) || {};
    const lostMin = Math.max(0, EFF_BAD() / 100 * (x.run + x.stop) - x.run);
    const beam = ok(x.warp_rate) && x.warp_rate > Math.max((S().warp_multiple || 2) * (b.warp_med || 0), S().warp_min_rate || 3);
    out.eff.push({x, now: x.eff, gap: EFF_BAD() - x.eff, impact: lostMin * x.rpm / 1e6, lostMin, beam});
  }
  const floor = (D.pressure.floor || []).slice(-1)[0];
  for (const x of L) {
    const b = bench(x.width, x.hg), t = tgt(x.width, x.hg) || {};
    if (!b) continue;
    // RPM
    const rB = b.rpm, rT = ok(t.rpm) ? t.rpm : null;
    const offRB = ok(rB) && x.rpm < rB - tolRpm(rB), offRT = ok(rT) && x.rpm < rT - tolRpm(rT);
    if (offRB || offRT) {
      const ref = Math.max(offRB ? rB : 0, offRT ? rT : 0);
      out.rpm.push({x, b, t, now: x.rpm, bm: rB, tg: rT, gap: ref - x.rpm, impact: (ref - x.rpm) * x.run / 1e6});
    }
    // CFM: benchmark CFM = benchmark air per 1,000 picks at this loom's own speed
    const cB = ok(b.apk) ? b.apk * x.rpm / 1000 : null, cT = ok(t.cfm) ? t.cfm : null;
    const offCB = ok(cB) && x.cfm > cB + tolAir(cB), offCT = ok(cT) && x.cfm > cT + tolAir(cT);
    if (offCB || offCT) {
      const ref = Math.min(offCB ? cB : Infinity, offCT ? cT : Infinity);
      out.cfm.push({x, b, t, now: x.cfm, bm: cB, tg: cT, gap: x.cfm - ref, impact: (x.cfm - ref) * x.run});
    }
    // Pressure: highest main pressure the loom ran at in the day vs head group benchmark
    const pB = ok(b.main_max) ? b.main_max : b.main, pT = ok(t.main) ? t.main : null;
    const offPB = ok(pB) && x.main_max > pB + PRESS_TOL, offPT = ok(pT) && x.main_max > pT + PRESS_TOL;
    if (offPB || offPT) {
      const ref = Math.min(offPB ? pB : Infinity, offPT ? pT : Infinity);
      out.press.push({x, b, t, now: x.main_max, bm: pB, tg: pT, gap: x.main_max - ref, atFloor: floor && Math.abs(x.main_max - floor.floor) < 1e-6});
    }

  out.eff.sort((a, b) => b.impact - a.impact);
  out.cfm.sort((a, b) => b.gap - a.gap);
  out.press.sort((a, b) => b.now - a.now || b.gap - a.gap);
  return out;
}

const HG_COLORS = ['#2f43c6', '#c2581d', '#1d7a4c', '#8a3fb5', '#0f7f8f', '#b4232c', '#6b7a1f', '#a15b8c', '#3d6fa3', '#7b5a2c', '#4d4d8f', '#2c8a63', '#9a6400', '#5c6378'];
function lineChart(series, dates, label, yUnit) {
  const Wd = 900, H = 280, m = {l: 56, r: 190, t: 22, b: 30};
  const svg = svgEl('svg', {viewBox: `0 0 ${Wd} ${H}`, width: '100%', class: 'chart', role: 'img', 'aria-label': label});
  const vals = series.flatMap((s) => s.pts.map((p) => p[1])).filter(ok);
  if (!vals.length || !dates.length) return el('div', {class: 'empty', text: 'Not enough days yet.'});
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.1 || Math.abs(hi) * 0.05 || 1; lo -= pad; hi += pad;
  const x = (i) => m.l + (dates.length === 1 ? (Wd - m.l - m.r) / 2 : i * (Wd - m.l - m.r) / (dates.length - 1));
  const y = (v) => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  const muted = css('--muted'), line = css('--line');
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4;
    svg.append(svgEl('line', {x1: m.l, x2: Wd - m.r, y1: y(v), y2: y(v), stroke: line}));
    const t = svgEl('text', {x: m.l - 8, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: muted}); t.textContent = Math.abs(hi) > 100 ? v.toFixed(0) : v.toFixed(Math.abs(hi) > 10 ? 1 : 2); svg.append(t); }
  const yu = svgEl('text', {x: 4, y: 12, 'font-size': 11.5, fill: muted}); yu.textContent = yUnit; svg.append(yu);
  const step = Math.max(1, Math.ceil(dates.length / 8));
  dates.forEach((d, i) => { if (i % step && i !== dates.length - 1) return; const t = svgEl('text', {x: x(i), y: H - 8, 'text-anchor': 'middle', 'font-size': 11, fill: muted}); t.textContent = dfmt(d); svg.append(t); });
  const ends = [];
  const order = series.slice().sort((a, b) => (a.hl ? 1 : 0) - (b.hl ? 1 : 0));
  for (const s of order) {
    const col = s.dim ? line : s.color;
    const pts = s.pts.map((p, i) => ok(p[1]) ? [x(i), y(p[1])] : null);
    let d = ''; pts.forEach((p, i) => { if (!p) return; d += (d && pts[i - 1] ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); });
    svg.append(svgEl('path', {d, fill: 'none', stroke: col, 'stroke-width': s.hl ? 3 : 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}));
    pts.forEach((p, i) => { if (!p) return; const c = svgEl('circle', {cx: p[0], cy: p[1], r: s.hl ? 4 : 3, fill: col}); const tt = svgEl('title'); tt.textContent = `${s.name}, ${dfmt(dates[i])}: ${s.pts[i][1]} ${yUnit}`; c.append(tt); svg.append(c); });
    const last = [...pts].reverse().find(Boolean); if (last && !s.dim) ends.push({y: last[1], s, col});
  }
  ends.sort((a, b) => a.y - b.y); let prev = -1e9;
  for (const e of ends) { const yy = Math.max(e.y, prev + 13); prev = yy; const t = svgEl('text', {x: Wd - m.r + 8, y: yy + 4, 'font-size': 11.5, 'font-weight': e.s.hl ? 700 : 400, fill: e.col}); t.textContent = e.s.name; svg.append(t); }
  return svg;
}
function pageTrends() {
  const s = el('section', {class: 'page', id: 'trends'});

  s.append(el('div', {}, el('h2', {text: `Trends by head group, ${wLabel()}`}),
    el('p', {class: 'lead', text: 'Daily values for each head group over the last 30 complete days, from looms that ran at least 60 minutes. Line names sit at the right end of each line; pick one head group to highlight it.'})));
  const metrics = [['eff', 'Efficiency', '%'], ['rpm', 'RPM', 'RPM'], ['cfm', 'CFM', 'CFM (ft³/min)'], ['apk', 'Air / 1,000 picks', 'ft³'], ['main_max', 'Main pressure', 'kgf/cm²'], ['warpRate', 'Warp breaks', 'per 100k picks']];
  const seg = el('div', {class: 'seg', role: 'group', 'aria-label': 'Metric'}, metrics.map(([k, l]) => el('button', {type: 'button', 'aria-pressed': TREND_METRIC === k ? 'true' : 'false', text: l, onclick: () => { TREND_METRIC = k; render(); }})));
  const by = new Map();
  for (const x of D.loomdays || []) { if (!inW(x.width) || x.run < 60 || x.hg === 'Unassigned' || !dates.includes(x.date)) continue; const k = key(x.width, x.hg); if (!by.has(k)) by.set(k, []); by.get(k).push(x); }
  const keys = [...by.keys()].sort();

  hl.addEventListener('change', () => { TREND_HL = hl.value; render(); });
  const unit = metrics.find((m) => m[0] === TREND_METRIC)[2];
  const series = keys.map((k, i) => {
    const L = by.get(k); const [w, hg] = k.split('|');
    return {name: W === 'all' ? `${hg} · ${w}` : hg, color: HG_COLORS[i % HG_COLORS.length], hl: TREND_HL === k, dim: TREND_HL && TREND_HL !== k,
      pts: dates.map((d) => { const A = agg(L.filter((x) => x.date === d)); const v = A ? A[TREND_METRIC] : null; return [d, ok(v) ? +v.toFixed(TREND_METRIC === 'rpm' ? 0 : 2) : null]; })};
  });
  s.append(card('Daily trend', unit, el('div', {class: 'toolbar'}, seg, el('label', {for: 'trend-hl', text: 'Highlight'}), hl), el('div', {class: 'tablebox'}, lineChart(series, dates, 'Daily ' + TREND_METRIC + ' by head group', unit))));
  const dr = (D.alerts || []).filter((a) => a.scope === 'Quality' && (W === 'all' || a.msg.includes(W + ' cm')));
  s.append(card('Drift alerts', 'Latest day vs the 7 days before, and week on week once 14 days exist', dr.length ? el('ul', {class: 'alerts'}, dr.map((a) => el('li', {}, el('span', {class: 'pill warn', text: a.level}), el('span', {text: a.msg})))) : el('div', {class: 'empty', text: 'No drift on this width.'})));
  return s;
}

// ---------------------------------------------------------------- Targets
function pageTargets() {
  const s = el('section', {class: 'page', id: 'targets'});
  s.append(el('div', {}, el('h2', {text: `Targets, ${wLabel()}`}),
    el('p', {class: 'lead', text: 'Set any or all of target CFM, RPM and main pressure for a head group on each width. Leave a box empty for no target. Every page compares against these alongside the benchmark; they apply as soon as you save.'})));
  const ks = new Map();
  for (const b of D.benchmarks || []) if (inW(b.width)) ks.set(key(b.width, b.hg), {w: b.width, hg: b.hg});
  for (const x of D.loomdays || []) if (inW(x.width) && x.hg !== 'Unassigned') ks.set(key(x.width, x.hg), {w: x.width, hg: x.hg});
  for (const k of Object.keys(TG)) { const t = TG[k]; if (inW(t.width)) ks.set(k, {w: t.width, hg: t.hg}); }
  const list = [...ks.values()].sort((a, b) => a.w.localeCompare(b.w) || a.hg.localeCompare(b.hg));
  const cur = new Map();
  for (const x of latestRecs()) { const k = key(x.width, x.hg); if (!cur.has(k)) cur.set(k, []); cur.get(k).push(x); }
  const rows = list.map(({w, hg}) => {
    const k = key(w, hg), b = bench(w, hg) || {}, t = TG[k] || {}, A = cur.has(k) ? agg(cur.get(k)) : null;
    const id = 'tg-' + tgtId(w, hg);
    const inp = (f, step, now, bm, fmt, bk) => el('div', {}, el('input', {type: 'number', id: `${id}-${f}`, step, min: '0', inputmode: 'decimal', 'aria-label': `Target ${f} for ${hg} ${w} cm`, value: ok(t[f]) ? String(t[f]) : null}),
      el('div', {class: 'hint'}, `now ${fmt(now)} · `, ok(bm) && bk ? bmBtn('bm ' + fmt(bm), w, hg, bk.m, bk) : `bm ${fmt(bm)}`));
    const msg = el('div', {class: 'meta'});
    const btn = el('button', {class: 'primary', type: 'button', text: 'Save', disabled: !db});
    btn.addEventListener('click', async () => {
      const num = (f) => { const v = $(`#${id}-${f}`).value.trim(); if (v === '') return null; const n = Number(v); return isFinite(n) && n > 0 ? n : NaN; };

    });

      inp('cfm', '0.1', A && A.cfm, cB, f1, {m: 'apk', view: 'cfm', rpm: A && A.rpm}), inp('rpm', '1', A && A.rpm, b.rpm, f0, {m: 'rpm'}), inp('main', '0.05', A && A.main_max, ok(b.main_max) ? b.main_max : b.main, f2, {m: pkey(b)}),
      el('div', {}, btn, msg)];
  });
  const tb = table(['Head group', ['Target CFM', 'ft³/min while running'], ['Target RPM', 'picks/min'], ['Target main pressure', 'kgf/cm²'], ''], rows);
  tb.classList.add('tg');

    el('p', {class: 'note', text: '"now" is the latest day (pressure: highest the head group ran at). Benchmark CFM is shown at the RPM run on the latest day. Targets are saved to the App targets tab of the Config Sheet.'}),
    !db ? el('p', {class: 'err', text: 'Saving targets is not connected yet (the app has no backend address).'}) : null));
  return s;
}

// ---------------------------------------------------------------- Data health
function pageData() {

    el('p', {class: 'lead', text: 'Every file the daily run looked at, which days are complete, and the checks behind the numbers.'})));

    (D.files || []).slice().reverse().map((f) => [f.checked_at, f.folder_date, f.file_name, f.date, f.shift, f.looms,
      el('span', {class: 'pill ' + ({ingested: 'good', quarantined: 'bad', duplicate: 'muted', skipped: 'muted', superseded: 'muted'}[f.status] || 'muted'), text: f.status}), f.reason]), [5])));

      ['Loom-day counts toward benchmark from', st.benchmark_min_run_min + ' min run'], ['RPM tolerance', st.tol_rpm_pct + '%'],       ['Air and CFM tolerance', st.tol_air_pct + '%'], ['Pressure tolerance (this page)', PRESS_TOL + ' kgf/cm²'], ['Line drop, compressor to loom', st.line_drop_bar + ' bar'],
      ['Long power-down (this page)', OFF_LONG / 60 + ' h'], ['Consistently low efficiency', `below ${f0(EFF_BAD())}% on ${LOW_EFF_DAYS} of last ${LOW_EFF_WINDOW} running days`]])));

const PAGES = {actions: pageActions, quality: pageQuality, pressure: pagePressure, cfm: pageCfm, utilisation: pageUtil, warp: pageWarp, trends: pageTrends, targets: pageTargets, data: pageData};
function render() {
  if (!D) return;
  for (const b of document.querySelectorAll('.controls .seg button')) b.setAttribute('aria-pressed', b.dataset.w === W ? 'true' : 'false');
  for (const a of document.querySelectorAll('nav.tabs a')) { if (a.dataset.tab === TAB) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
  const pendingNames = (D.unassigned || []).filter((u) => !assigned[u.style]).length;
  const cnt = $('#cnt-assign'); cnt.hidden = !pendingNames; cnt.textContent = pendingNames;
  const y = window.scrollY;
  $('#main').replaceChildren(PAGES[TAB]());
  window.scrollTo(0, y);
}
function setTab(t) { TAB = PAGES[t] ? t : 'actions'; render(); window.scrollTo(0, 0); }
function busyEditing(sel) { const a = document.activeElement; return a && a.closest && a.closest(sel); }

for (const b of document.querySelectorAll('.controls .seg button')) b.addEventListener('click', () => { W = b.dataset.w; try { localStorage.setItem('w2-width', W); } catch (e) {} render(); });
window.addEventListener('hashchange', () => setTab(location.hash.slice(1)));
try { const w = localStorage.getItem('w2-width'); if (w === '190' || w === '280' || w === 'all') W = w; } catch (e) {}
TAB = PAGES[location.hash.slice(1)] ? location.hash.slice(1) : 'actions';

// ---------------------------------------------------------------- Web app loader
// Data: data/data.enc.json in this repo, encrypted with the app passcode (the repo is public).
// Targets and head-group answers: the Apps Script web app in the Config Sheet (API below).
const API = 'https://script.google.com/macros/s/AKfycbwD3PuZjPLN9BDkCo0UwuG1m2OrIvWw1PV-UXwebdLQlZMIh-x3e9ocw2KLVIWCwQAVQA/exec';
const KEY_STORE = 'w2-passcode';
let lastLoad = 0, loading = false;

const getKey = () => { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return window.__w2key || ''; } };
const setKey = (k) => { window.__w2key = k; try { localStorage.setItem(KEY_STORE, k); } catch (e) {} };
const clearKey = () => { window.__w2key = ''; try { localStorage.removeItem(KEY_STORE); } catch (e) {} };
const normKey = (v) => { const a = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return a.length === 16 ? a.match(/.{4}/g).join('-') : String(v || '').trim().toUpperCase(); };

async function openSealed(o, pass) {
  const b64 = (x) => Uint8Array.from(atob(x), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(o.salt), iterations: o.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  let buf = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(o.iv)}, k, b64(o.ct));
  if (o.gz) buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  return new TextDecoder().decode(buf);
}

// Backend calls. POST bodies go as text/plain so the browser sends no CORS preflight.
async function api(action, body) {
  const r = await fetch(API, {method: 'POST', body: JSON.stringify(Object.assign({key: getKey(), action}, body))});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'save failed');
  applyState(j);
  return j;
}
function applyState(st) {
  if (st.targets) {
    TG = {};
    for (const v of st.targets) if (v && v.width && v.hg) TG[key(String(v.width), v.hg)] = v;
    targetsLoaded = true;
  }
  if (st.assignments) {
    assigned = {};
    for (const v of st.assignments) if (v && v.status === 'pending') assigned[v.style] = v;
  }
}
// Same calls the page made against the artifact database, now sent to the Sheet.
const sheetDb = {
  collection: (name) => ({
    doc: (id) => ({
      set: (data) => name === 'targets' ? api('setTarget', {id, data}) : api('assign', {data}),
      delete: () => api('deleteTarget', {id}),
    }),
  }),
};
async function loadState() {
  try {
    const r = await fetch(`${API}?action=state&key=${encodeURIComponent(getKey())}&t=${Date.now()}`, {cache: 'no-store'});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    applyState(j);
  } catch (e) {
    targetsLoaded = true;
  }
  if (D && !busyEditing('.tg') && !busyEditing('.assign')) render();
}

function showGate(msg) {
  $('#asof').textContent = 'Locked';
  const inp = el('input', {type: 'text', id: 'pass', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: 'XXXX-XXXX-XXXX-XXXX', 'aria-label': 'Passcode'});
  const go = el('button', {type: 'submit', text: 'Open'});
  const form = el('form', {class: 'gate'}, el('h2', {text: 'Enter the app passcode'}),
    el('p', {class: 'note', style: 'margin:0', text: 'Asked once on each device. It unlocks the loom data and lets you save targets.'}),
    inp, msg ? el('p', {class: 'err', style: 'margin:0', text: msg}) : null, go);
  form.addEventListener('submit', (ev) => { ev.preventDefault(); const k = normKey(inp.value); if (!k) return; setKey(k); load(); });
  $('#main').replaceChildren(form);
  inp.focus();
}

async function load(quiet) {
  if (loading) return;
  const pass = getKey();
  if (!pass) { showGate(); return; }
  loading = true;
  if (!quiet || !D) $('#main').replaceChildren(el('div', {class: 'loading', text: 'Loading loom data…'}));
  try {
    const r = await fetch('data/data.enc.json?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const sealed = await r.json();
    let text;
    try { text = await openSealed(sealed, pass); }
    catch (e) { clearKey(); loading = false; showGate('That passcode did not work. Check it and try again.'); return; }
    D = JSON.parse(text);
  } catch (e) {
    loading = false;
    if (!D) $('#main').replaceChildren(el('div', {class: 'loading', text: 'Could not load the loom data. Check your connection and tap Refresh; if it persists, the daily run may have failed.'}));
    return;
  }
  loading = false;
  lastLoad = Date.now();
  BM.clear();
  for (const b of D.benchmarks || []) BM.set(key(b.width, b.hg), b);
  const done = (D.days || []).filter((d) => d.status === 'complete').length;
  $('#asof').replaceChildren('Latest complete day ', el('b', {text: dfmt(D.latest)}), ` · ${done} day${done === 1 ? '' : 's'} of history · updated ${D.generated_at} IST`);
  if (API) { db = sheetDb; loadState(); } else { db = null; targetsLoaded = true; }
  render();
}

// Data health page: a way to lock this device again.
const basePageData = PAGES.data;
PAGES.data = () => {
  const s = basePageData();
  s.append(el('p', {}, el('button', {class: 'ghost', type: 'button', text: 'Forget the passcode on this device', onclick: () => { clearKey(); location.reload(); }})));
  return s;
};

$('#refresh').addEventListener('click', () => load(true));
// The home-screen app stays in memory on iPhone; refetch when it comes back after a while.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastLoad > 15 * 60e3) load(true); });
load();
})();
</script>
